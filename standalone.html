    body {
      background-color: #0B0C10;

      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-unbounded {
      font-family: 'Unbounded', sans-serif;
    }
    .pb-safe {
      padding-bottom: max(env(safe-area-inset-bottom, 16px), 16px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Планетарное атмосферное свечение в правом верхнем углу (в точности как на скриншоте) */
    .planet-glow-arc {
      position: absolute;
      top: -180px;
      right: -100px;
      width: 750px;
      height: 480px;
      border-radius: 50%;
      border-top: 2px solid rgba(239, 35, 60, 0.85);
      box-shadow: 0 -12px 60px 8px rgba(239, 35, 60, 0.35), inset 0 20px 80px rgba(239, 35, 60, 0.15);

</head>
<body class="bg-[#0B0C10] text-white overflow-x-hidden antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0B0C10');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0B0C10');
      } catch (e) {}
    }

    const triggerHaptic = (type) => {
      if (tg?.HapticFeedback) {
        try {
          if (type === 'selection') tg.HapticFeedback.selectionChanged();
          else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else tg.HapticFeedback.impactOccurred(type);
        } catch(e) {}
      }
    };

    // ================= SVG ИКОНКИ (БЕЗ ЭМОДЗИ) =================
    const IconHome = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>

    );

    const IconCalendar = ({ className = "w-4 h-4" }) => (

    // ================= ДАННЫЕ =================

          { time: '12:15 – 13:45', room: 'Спортзал', subject: 'Физическая культура', teacher: 'Миронов Д. Д.', status: 'ПО ПЛАНУ', style: 'ok' }
        ]

      {
        day: 'Среда',
        date: '15 октября',
        lessons: [
          { time: '08:30 – 10:00', room: 'Ауд. 305', subject: 'Компьютерные сети', teacher: 'Николаев А. Е.', status: 'ПО ПЛАНУ', style: 'ok' },
          { time: '10:15 – 11:45', room: 'Ауд. 305', subject: 'Компьютерные сети (лаб)', teacher: 'Николаев А. Е.', status: 'ДЕДЛАЙН', style: 'warn' }
        ]
      },
      {
        day: 'Четверг',
        date: '16 октября',
        lessons: [
          { time: '10:15 – 11:45', room: 'Ауд. 108', subject: 'Архитектура ЭВМ', teacher: 'Ковалев П. С.', status: 'ПО ПЛАНУ', style: 'ok' },
          { time: '12:15 – 13:45', room: 'Ауд. 108', subject: 'Операционные системы', teacher: 'Ковалев П. С.', status: 'ПО ПЛАНУ', style: 'ok' }
        ]
      },
      {
        day: 'Пятница',
        date: '17 октября',
        isToday: true,
        lessons: [
          { time: '08:30 – 10:00', room: 'Ауд. 203', subject: 'Высшая математика', teacher: 'Иванов А. С.', status: 'ОТМЕНА', style: 'cancel' },
          { time: '10:15 – 11:45', room: 'Ауд. 108', subject: 'Программирование', teacher: 'Петров К. В.', status: 'ПО ПЛАНУ', style: 'ok' },
          { time: '12:15 – 13:45', room: 'Ауд. 314', subject: 'Базы данных', teacher: 'Сидорова М. А.', status: 'ДЕДЛАЙН', style: 'warn' }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [myStatus, setMyStatus] = useState('present');
      const [counts, setCounts] = useState({ present: 20, late: 2, excuse: 2, absent: 4 });
      const [isExportOpen, setIsExportOpen] = useState(false);
      const [isImportantOpen, setIsImportantOpen] = useState(false);
      const [isContactsOpen, setIsContactsOpen] = useState(false);
      const [selectedScheduleDay, setSelectedScheduleDay] = useState(4); // Пятница по умолчанию

      const totalStudents = 28;
      const attended = counts.present + counts.late + counts.excuse; // 24 из 28
      const percent = Math.round((attended / totalStudents) * 100);

      const handleTabSwitch = (tab) => {
        triggerHaptic('selection');
        setActiveTab(tab);
      };

      const handleStatusClick = (status) => {
        triggerHaptic('medium');
        if (myStatus === status) return;
        setCounts(prev => {
          const next = { ...prev };
          if (myStatus && next[myStatus] > 0) next[myStatus]--;
          next[status]++;
          return next;
        });
        setMyStatus(status);
      };

      const handleExport = () => {
        triggerHaptic('success');
        setIsExportOpen(true);
      };

      const downloadCsv = () => {
        const text = "\uFEFF№;ФИО;Статус;Группа\n1;Борисов Иван;На парах;ИВТ-21\n2;Алексеева Дарья;На парах;ИВТ-21\n3;Васильев Максим;На парах;ИВТ-21\n4;Дмитриев Артем;Опаздывает;ИВТ-21\n5;Жукова Полина;Уважительная;ИВТ-21\n6;Зайцев Роман;Отсутствует;ИВТ-21\n";
        const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Перекличка_ИВТ-21_17_октября.csv";
        a.click();
      };

      const getBadgeClass = (style) => {
        if (style === 'cancel') return 'bg-[#3A141A] text-[#FB7185] border border-[#EF233C]/40';
        if (style === 'ok') return 'bg-[#064E3B] text-[#34D399] border border-[#10B981]/40';
        if (style === 'warn') return 'bg-[#451A03] text-[#FBBF24] border border-[#F59E0B]/40';
        return 'bg-[#1A1D27] text-gray-300';
      };

      return (
        <div className="min-h-screen bg-[#0B0C10] flex justify-center relative overflow-x-hidden selection:bg-[#EF233C] selection:text-white">

            {/* ========================================================= */}
            <div className="hidden lg:flex w-full min-h-screen">
              {/* Боковое меню (Сайдбар) */}

                  </div>

                  {/* Кнопки навигации */}
                  <nav className="space-y-2">
                    <button
                      onClick={() => handleTabSwitch('home')}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-semibold transition-all select-none ${
                        activeTab === 'home'
                          ? 'bg-[#321319] text-white border border-[#EF233C]/40 shadow-[0_0_16px_rgba(239,35,60,0.25)]'
                          : 'text-[#8E95A5] hover:text-white hover:bg-[#161822]'
                      }`}
                    >
                      <IconHome className={`w-4 h-4 ${activeTab === 'home' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`} />
                      <span>Главная</span>
                    </button>

                    <button
                      onClick={() => handleTabSwitch('schedule')}

                        activeTab === 'schedule'
                          ? 'bg-[#321319] text-white border border-[#EF233C]/40 shadow-[0_0_16px_rgba(239,35,60,0.25)]'
                          : 'text-[#8E95A5] hover:text-white hover:bg-[#161822]'
                      }`}
                    >
                      <IconCalendar className={`w-4 h-4 ${activeTab === 'schedule' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`} />
                      <span>Расписание</span>
                    </button>

                    <button
                      onClick={() => handleTabSwitch('stats')}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-semibold transition-all select-none ${
                        activeTab === 'stats'
                          ? 'bg-[#321319] text-white border border-[#EF233C]/40 shadow-[0_0_16px_rgba(239,35,60,0.25)]'

                          ? 'bg-[#321319] text-white border border-[#EF233C]/40 shadow-[0_0_16px_rgba(239,35,60,0.25)]'

                  </p>
                </div>

                {/* ================= ВКЛАДКА: ГЛАВНАЯ ================= */}
                {activeTab === 'home' && (
                  <div className="grid grid-cols-12 gap-6 items-start">
                    {/* Левая широкая колонка с 2 карточками */}
                    <div className="col-span-8 space-y-6">
                      {/* Карточка: Расписание на сегодня */}
                      <div className="w-full bg-[#14161D] rounded-2xl border border-white/[0.08] p-5 shadow-[0_8px_30px_rgb(0,0,0,0.4)]">

                            <span className="relative flex h-2.5 w-2.5">

                            </span>

                        </div>
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#3A141A] text-[#FB7185] border border-[#EF233C]/40">
                          ОТМЕНА
                        </span>
                      </div>

                      <div className="flex items-center justify-between p-3 rounded-xl bg-[#1A1D27]/80 hover:bg-[#1E2230] cursor-pointer">
                        <div className="w-24 shrink-0">
                          <div className="text-[13px] font-semibold text-white font-mono">10:15 – 11:45</div>
                          <div className="text-[11px] text-[#8E95A5]">Ауд. 108</div>
                        </div>
                        <div className="flex-1 px-3 min-w-0">
                          <div className="text-[13px] font-semibold text-gray-100 truncate">Программирование</div>
                          <div className="text-[11px] text-[#8E95A5] truncate">Петров К. В.</div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#064E3B] text-[#34D399] border border-[#10B981]/40">
                          ПО ПЛАНУ
                        </span>
                      </div>

                      <div className="flex items-center justify-between p-3 rounded-xl bg-[#1A1D27]/80 hover:bg-[#1E2230] cursor-pointer">
                        <div className="w-24 shrink-0">
                          <div className="text-[13px] font-semibold text-white font-mono">12:15 – 13:45</div>
                          <div className="text-[11px] text-[#8E95A5]">Ауд. 314</div>
                        </div>
                        <div className="flex-1 px-3 min-w-0">
                          <div className="text-[13px] font-semibold text-gray-100 truncate">Базы данных</div>
                          <div className="text-[11px] text-[#8E95A5] truncate">Сидорова М. А.</div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#451A03] text-[#FBBF24] border border-[#F59E0B]/40">
                          ДЕДЛАЙН
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Карточка: Перекличка */}
                  <div className="w-full bg-[#14161D] rounded-2xl border border-white/[0.08] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.4)]">
                    <div className="flex items-center gap-2 mb-4">
                      <IconUsers className="w-4 h-4 text-gray-300" />
                      <h2 className="text-[15px] font-semibold text-white tracking-wide">Перекличка</h2>
                    </div>

                    {/* Сетка 2x2 на мобайле */}
                    <div className="grid grid-cols-2 gap-2.5 mb-5">
                      <button
                        onClick={() => handleStatusClick('present')}
                        className={`flex items-center justify-center gap-2 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#059669] active:scale-95 transition-all select-none ${
                          myStatus === 'present' ? 'ring-2 ring-white/90 shadow-md' : 'opacity-90'
                        }`}
                      >
                        <IconCheck className="w-4 h-4" />
                        <span>На парах</span>
                      </button>

                      <button
                        onClick={() => handleStatusClick('late')}
                        className={`flex items-center justify-center gap-2 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#B45309] active:scale-95 transition-all select-none ${
                          myStatus === 'late' ? 'ring-2 ring-white/90 shadow-md' : 'opacity-90'
                        }`}
                      >
                        <IconClock className="w-4 h-4" />
                        <span>Опаздываю</span>
                      </button>

                      <button
                        onClick={() => handleStatusClick('excuse')}
                        className={`flex items-center justify-center gap-2 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#4F46E5] active:scale-95 transition-all select-none ${
                          myStatus === 'excuse' ? 'ring-2 ring-white/90 shadow-md' : 'opacity-90'
                        }`}
                      >
                        <IconShield className="w-4 h-4" />
                        <span>Уважительная</span>
                      </button>

                      <button
                        onClick={() => handleStatusClick('absent')}
                        className={`flex items-center justify-center gap-2 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#991B1B] active:scale-95 transition-all select-none ${
                          myStatus === 'absent' ? 'ring-2 ring-white/90 shadow-md' : 'opacity-90'
                        }`}
                      >
                        <IconCross className="w-4 h-4" />
                        <span>Отсутствую</span>
                      </button>
                    </div>

                    <div className="space-y-3">
                      <div className="flex items-center justify-between text-xs font-medium text-gray-200">
                        <div>
                          Явка: <b className="text-white">{attended} из {totalStudents}</b> <span className="text-[#8E95A5]">({percent}%)</span>
                        </div>
                        <button
                          onClick={handleExport}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#1A1D27] hover:bg-[#252937] text-gray-300 border border-white/10 font-mono text-[11px] active:scale-95 transition-all"
                        >
                          <IconDownload className="w-3 h-3 text-gray-400" />
                          <span>/export → .xlsx</span>
                        </button>
                      </div>
                      <div className="w-full h-1.5 bg-[#1F222E] rounded-full overflow-hidden">
                        <div
                          className="h-full bg-gradient-to-r from-[#EF233C] to-[#FF2A4B] rounded-full transition-all duration-500 shadow-[0_0_12px_rgba(239,35,60,0.8)]"
                          style={{ width: `${percent}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'schedule' && (
                <div className="space-y-4 pt-1">
                  <div className="text-sm font-bold font-unbounded text-white">Расписание недели</div>
                  <div className="space-y-3">
                    {WEEK_SCHEDULE.map((day) => (
                      <div key={day.day} className="p-4 rounded-xl bg-[#14161D] border border-white/10 space-y-2.5">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-white">{day.day}, {day.date}</span>
                          {day.isToday && <span className="text-[10px] text-[#EF233C] font-bold">СЕГОДНЯ</span>}
                        </div>
                        <div className="space-y-2">
                          {day.lessons.map((l, i) => (
                            <div key={i} className="flex justify-between items-center text-xs p-2 rounded-lg bg-[#1A1D27]">
                              <div>
                                <div className="font-semibold text-gray-100">{l.subject}</div>
                                <div className="text-[11px] text-[#8E95A5]">{l.time} • {l.room}</div>
                              </div>
                              <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold uppercase ${getBadgeClass(l.style)}`}>
                                {l.status}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'stats' && (
                <div className="space-y-4 pt-1">
                  <div className="text-sm font-bold font-unbounded text-white">Статистика группы ИВТ-21</div>
                  <div className="p-5 rounded-2xl bg-[#14161D] border border-white/10">
                    <div className="text-xs text-[#8E95A5]">Общая явка группы</div>
                    <div className="text-3xl font-extrabold text-white mt-1 font-unbounded">89.4%</div>
                    <div className="w-full h-1.5 bg-[#1F222E] rounded-full mt-3 overflow-hidden">
                      <div className="h-full bg-emerald-500 rounded-full" style={{ width: '89.4%' }}></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="p-4 rounded-xl bg-[#14161D] border border-white/10">
                      <div className="text-xs text-[#8E95A5]">Без пропусков</div>
                      <div className="text-xl font-bold text-emerald-400 mt-1">16 чел</div>
                    </div>
                    <div className="p-4 rounded-xl bg-[#14161D] border border-white/10">
                      <div className="text-xs text-[#8E95A5]">В зоне риска</div>
                      <div className="text-xl font-bold text-amber-400 mt-1">3 чел</div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="space-y-4 pt-1">
                  <div className="text-sm font-bold font-unbounded text-white">Настройки</div>
                  <div className="p-4 rounded-xl bg-[#14161D] border border-white/10 text-xs space-y-2">
                    <div className="text-gray-200"><b>Пользователь:</b> Иван Борисов (Староста)</div>
                    <div className="text-gray-200"><b>Группа:</b> ИВТ-21</div>
                    <div className="text-[#8E95A5] text-[11px] pt-2 border-t border-white/5">
                      РИТМ Telegram Mini App • Версия 1.2.0
                    </div>
                  </div>
                </div>
              )}

              {/* Нижний таб-бар на мобильном устройстве */}
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0B0C10]/95 backdrop-blur-md border-t border-white/[0.08] px-4 pt-2 pb-safe">
                <div className="max-w-md mx-auto flex items-center justify-around pb-2">
                  <button
                    onClick={() => handleTabSwitch('home')}
                    className={`flex flex-col items-center py-1 px-3 ${activeTab === 'home' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}
                  >
                    <IconHome className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Главная</span>
                  </button>

                  <button
                    onClick={() => handleTabSwitch('schedule')}
                    className={`flex flex-col items-center py-1 px-3 ${activeTab === 'schedule' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}
                  >
                    <IconCalendar className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Расписание</span>
                  </button>

                  <button
                    onClick={() => handleTabSwitch('stats')}
                    className={`flex flex-col items-center py-1 px-3 ${activeTab === 'stats' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}
                  >
                    <IconStats className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Статистика</span>
                  </button>

                  <button
                    onClick={() => handleTabSwitch('settings')}
                    className={`flex flex-col items-center py-1 px-3 ${activeTab === 'settings' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}
                  >
                    <IconSettings className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Настройки</span>
                  </button>
                </div>
              </nav>
            </div>
          </div>

          {/* Модалка контактов деканата */}
          {isContactsOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setIsContactsOpen(false)}>
              <div className="w-full max-w-sm bg-[#161822] border border-white/15 rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-sm font-bold text-white">Контакты деканата</h3>
                  <button onClick={() => setIsContactsOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <div className="text-xs text-gray-300 space-y-2">
                  <div><b>Телефон:</b> +7 (495) 123-45-67</div>
                  <div><b>Email:</b> dekanat@university.ru</div>
                  <div><b>Кабинет:</b> 204 (Главный корпус)</div>
                  <div><b>Приёмные часы:</b> Пн-Пт с 10:00 до 16:00</div>
                </div>
                <button onClick={() => setIsContactsOpen(false)} className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white text-xs font-semibold transition-all">
                  Закрыть
                </button>
              </div>
            </div>
          )}

          {/* Модалка экспорта в Excel */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setIsExportOpen(false)}>
              <div className="w-full sm:max-w-md bg-[#161822] border border-white/15 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white">Выгрузка журнала явки</h3>
                  <button onClick={() => setIsExportOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-gray-300">
                  Сформирован файл посещаемости группы <b>ИВТ-21</b> за 17 октября ({attended} из {totalStudents} присутствуют).
                </p>
                <div className="flex gap-2.5 pt-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(`Отчет явки (ИВТ-21, 17 октября): ${attended} из ${totalStudents} присутствуют.`);
                      alert('Отчет скопирован в буфер обмена!');
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-[#1A1D27] hover:bg-[#252937] text-white text-xs font-semibold border border-white/10 transition-all"
                  >
                    Копировать текст
                  </button>
                  <button
                    onClick={downloadCsv}
                    className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-[#059669] hover:bg-[#10B981] text-white text-xs font-semibold transition-all shadow-md"
                  >
                    <IconDownload className="w-3.5 h-3.5" />
                    <span>Скачать .xlsx</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
