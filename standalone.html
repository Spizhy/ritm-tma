              )}

              {/* Нижний таб-бар */}
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0B0C10]/95 backdrop-blur-md border-t border-white/[0.08] px-4 pt-2 pb-safe">
                <div className="max-w-md mx-auto flex items-center justify-around pb-2">
                  <button onClick={() => handleTabSwitch('home')} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'home' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}>
                    <IconHome className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Главная</span>
                  </button>

                  <button onClick={() => handleTabSwitch('schedule')} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'schedule' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}>
                    <IconCalendar className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Расписание</span>
                  </button>

                  <button onClick={() => handleTabSwitch('stats')} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'stats' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}>
                    <IconStats className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Статистика</span>
                  </button>

                  <button onClick={() => handleTabSwitch('settings')} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'settings' ? 'text-[#EF233C]' : 'text-[#8E95A5]'}`}>
                    <IconSettings className="w-5 h-5" />
                    <span className="text-[10px] mt-1 font-medium">Настройки</span>
                  </button>
                </div>
              </nav>
            </div>
          </div>

          {/* ================= МОДАЛКИ ================= */}

          {/* 1. Модалка отмены / переноса пары старостой */}
          {editingLesson && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4" onClick={() => setEditingLesson(null)}>
              <div className="w-full max-w-lg bg-[#14161F] border border-white/10 rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white font-brand">Шаблон старосты: Пара</h3>
                    <p className="text-[11px] text-[#8E95A5]">Связано с расписанием и ботом группы</p>
                  </div>
                  <button onClick={() => setEditingLesson(null)} className="w-7 h-7 rounded-full bg-[#1A1D27] text-gray-400 hover:text-white flex items-center justify-center text-xs">✕</button>
                </div>

                <div className="p-3 rounded-xl bg-[#1A1D27] text-xs space-y-1">
                  <div className="font-mono text-[#EF233C] font-semibold">{editingLesson.timeStart} – {editingLesson.timeEnd} • {editingLesson.teacher}</div>
                  <div className="font-bold text-white text-sm">{editingLesson.subject}</div>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[11px] font-semibold text-gray-300 uppercase mb-1.5">Статус пары</label>
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        type="button"
                        onClick={() => setEditingLesson({ ...editingLesson, status: 'CANCELLED', statusLabel: 'ОТМЕНА' })}
                        className={`py-2 rounded-xl font-bold border transition-all ${editingLesson.status === 'CANCELLED' ? 'bg-[#351219] text-[#EF233C] border-[#EF233C]' : 'bg-[#181A24] text-gray-400 border-white/5'}`}
                      >
                        ОТМЕНА
                      </button>
                      <button
                        type="button"
                        onClick={() => setEditingLesson({ ...editingLesson, status: 'PLANNED', statusLabel: 'ПО ПЛАНУ' })}
                        className={`py-2 rounded-xl font-bold border transition-all ${editingLesson.status === 'PLANNED' ? 'bg-[#093325] text-[#10B981] border-[#10B981]' : 'bg-[#181A24] text-gray-400 border-white/5'}`}
                      >
                        ПО ПЛАНУ
                      </button>
                      <button
                        type="button"
                        onClick={() => setEditingLesson({ ...editingLesson, status: 'DEADLINE', statusLabel: 'ДЕДЛАЙН' })}
                        className={`py-2 rounded-xl font-bold border transition-all ${editingLesson.status === 'DEADLINE' ? 'bg-[#38200B] text-[#F59E0B] border-[#F59E0B]' : 'bg-[#181A24] text-gray-400 border-white/5'}`}
                      >
                        ДЕДЛАЙН
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-gray-300 uppercase mb-1">Аудитория / Локация</label>
                    <input
                      type="text"
                      value={editingLesson.room || ''}
                      onChange={e => setEditingLesson({ ...editingLesson, room: e.target.value })}
                      className="w-full bg-[#1A1D27] border border-white/10 rounded-xl px-3 py-2 text-white"
                      placeholder="Ауд. 203 или Дистант"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-gray-300 uppercase mb-1">Причина / Комментарий для группы</label>
                    <textarea
                      rows={2}
                      value={editingLesson.note || ''}
                      onChange={e => setEditingLesson({ ...editingLesson, note: e.target.value })}
                      className="w-full bg-[#1A1D27] border border-white/10 rounded-xl p-3 text-white"
                      placeholder="Преподаватель на больничном / перенос деканатом..."
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setEditingLesson(null)} className="flex-1 py-2.5 rounded-xl bg-white/5 text-gray-300 text-xs font-semibold">
                    Отмена
                  </button>
                  <button
                    onClick={() => handleSaveLesson(editingLesson, true)}
                    className="flex-2 py-2.5 px-4 rounded-xl bg-[#EF233C] hover:bg-[#D90429] text-white text-xs font-bold shadow-md cursor-pointer"
                  >
                    Сохранить и оповестить чат
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 2. Модалка импорта расписания */}
          {isImportOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4" onClick={() => setIsImportOpen(false)}>
              <div className="w-full max-w-xl bg-[#14161F] border border-white/10 rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white font-brand">Импорт расписания</h3>
                  <button onClick={() => setIsImportOpen(false)} className="w-7 h-7 rounded-full bg-[#1A1D27] text-gray-400 hover:text-white flex items-center justify-center text-xs">✕</button>
                </div>

                <p className="text-xs text-gray-400">
                  Вставьте строки расписания из Excel, Word или сайта вуза:
                </p>

                <textarea
                  id="importTextarea"
                  rows={6}
                  defaultValue={`Пятница
08:30 - 10:00 | Высшая математика | Ауд. 203 | Иванов А. С.
10:15 - 11:45 | Программирование | Ауд. 108 | Петров К. В.
12:15 - 13:45 | Базы данных | Ауд. 314 | Сидорова М. А.`}
                  className="w-full bg-[#1A1D27] border border-white/10 rounded-xl p-3 text-white font-mono text-xs"
                />

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsImportOpen(false)} className="px-4 py-2 rounded-xl bg-white/5 text-gray-300 text-xs font-semibold">
                    Отмена
                  </button>
                  <button
                    onClick={() => {
                      const txt = document.getElementById('importTextarea').value;
                      const parsedDay = {
                        dayOfWeek: 'Пятница',
                        dateStr: '17 октября',
                        isToday: true,
                        lessons: [
                          { id: 'imp-1', timeStart: '08:30', timeEnd: '10:00', subject: 'Высшая математика', room: 'Ауд. 203', teacher: 'Иванов А. С.', status: 'PLANNED', statusLabel: 'ПО ПЛАНУ' },
                          { id: 'imp-2', timeStart: '10:15', timeEnd: '11:45', subject: 'Программирование', room: 'Ауд. 108', teacher: 'Петров К. В.', status: 'PLANNED', statusLabel: 'ПО ПЛАНУ' },
                          { id: 'imp-3', timeStart: '12:15', timeEnd: '13:45', subject: 'Базы данных', room: 'Ауд. 314', teacher: 'Сидорова М. А.', status: 'DEADLINE', statusLabel: 'ДЕДЛАЙН' },
                        ]
                      };
                      handleApplyImport([parsedDay]);
                    }}
                    className="px-4 py-2 rounded-xl bg-[#EF233C] text-white text-xs font-bold hover:bg-[#D90429]"
                  >
                    Применить в расписание РИТМ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. Модалка базы группы и Telegram никнеймов */}
          {isRosterOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4" onClick={() => setIsRosterOpen(false)}>
              <div className="w-full max-w-xl bg-[#14161F] border border-white/10 rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white font-brand">Список группы и Telegram профили</h3>
                    <p className="text-[11px] text-[#8E95A5]">Группа ИВТ-21 • {students.length} студентов</p>
                  </div>
                  <button onClick={() => setIsRosterOpen(false)} className="w-7 h-7 rounded-full bg-[#1A1D27] text-gray-400 hover:text-white flex items-center justify-center text-xs">✕</button>
                </div>

                <div className="flex gap-2">
                  <button onClick={copyReportToClipboard} className="flex-1 py-2 rounded-xl bg-[#202433] hover:bg-[#282E40] border border-white/10 text-xs font-semibold text-gray-200 flex items-center justify-center gap-1.5 cursor-pointer">
                    <IconCopy className="w-3.5 h-3.5" />
                    <span>Скопировать отчет для старосты</span>
                  </button>
                </div>

                <div className="space-y-1.5 max-h-[50vh] overflow-y-auto pr-1">
                  {students.map((student, idx) => {
                    const stMap = {
                      present: { label: 'На парах', cls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' },
                      late: { label: 'Опаздывает', cls: 'bg-amber-500/20 text-amber-400 border-amber-500/40' },
                      excuse: { label: 'Уважительная', cls: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' },
                      absent: { label: 'Отсутствует', cls: 'bg-rose-500/20 text-rose-400 border-rose-500/40' },
                    };
                    const badge = stMap[student.status] || stMap.present;
                    const nextMap = { present: 'late', late: 'excuse', excuse: 'absent', absent: 'present' };

                    return (
                      <div key={student.id} className="flex items-center justify-between p-2.5 rounded-xl bg-[#171922] border border-white/5">
                        <div className="min-w-0 pr-2">
                          <div className="text-xs font-semibold text-white truncate">{idx + 1}. {student.name}</div>
                          {student.username && (
                            <a href={`https://t.me/${student.username}`} target="_blank" rel="noreferrer" className="text-[11px] text-[#EF233C] hover:underline flex items-center gap-1">
                              <span>@{student.username}</span>
                              <IconExternal className="w-2.5 h-2.5" />
                            </a>
                          )}
                        </div>
                        <button
                          onClick={() => handleStudentStatusChange(student.id, nextMap[student.status])}
                          className={`px-3 py-1 rounded-xl text-[11px] font-semibold border transition-all cursor-pointer ${badge.cls}`}
                          title="Кликните для смены статуса"
                        >
                          {badge.label}
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div className="flex justify-end pt-2 border-t border-white/5">
                  <button onClick={() => setIsRosterOpen(false)} className="px-4 py-2 bg-white/10 text-white rounded-xl text-xs font-semibold">
                    Закрыть
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 4. Модалка контактов деканата */}
          {isContactsOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setIsContactsOpen(false)}>
              <div className="w-full max-w-sm bg-[#161822] border border-white/15 rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-sm font-bold text-white">Контакты деканата</h3>
                  <button onClick={() => setIsContactsOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <div className="text-xs text-gray-300 space-y-2">
                  <div><b>Телефон:</b> +7 (495) 123-45-67</div>
                  <div><b>Email:</b> dekanat@university.ru</div>
                  <div><b>Кабинет:</b> 204 (Главный корпус)</div>
                  <div><b>Приёмные часы:</b> Пн-Пт с 10:00 до 16:00</div>
                </div>
                <button onClick={() => setIsContactsOpen(false)} className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white text-xs font-semibold transition-all">
                  Закрыть
                </button>
              </div>
            </div>
          )}

          {/* 5. Модалка экспорта в Excel */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setIsExportOpen(false)}>
              <div className="w-full sm:max-w-md bg-[#161822] border border-white/15 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white">Выгрузка журнала явки</h3>
                  <button onClick={() => setIsExportOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-gray-300">
                  Сформирован файл посещаемости группы <b>ИВТ-21</b> за 17 октября ({attended} из {totalStudents} присутствуют).
                </p>
                <div className="flex gap-2.5 pt-2">
                  <button
                    onClick={copyReportToClipboard}
                    className="flex-1 py-2.5 rounded-xl bg-[#1A1D27] hover:bg-[#222634] text-white text-xs font-semibold border border-white/10 transition-all cursor-pointer"
                  >
                    Копировать текст
                  </button>
                  <button
                    onClick={downloadCsv}
                    className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-[#059669] hover:bg-[#10B981] text-white text-xs font-semibold transition-all shadow-md cursor-pointer"
                  >
                    <IconDownload className="w-3.5 h-3.5" />
                    <span>Скачать .xlsx</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
