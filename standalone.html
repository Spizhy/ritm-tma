  <script type="text/babel">
    const { useState, useEffect } = React;

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0B0C10');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0B0C10');
      } catch (e) {}
    }

    const triggerHaptic = (type) => {
      if (tg?.HapticFeedback) {
        try {
          if (type === 'selection') tg.HapticFeedback.selectionChanged();
          else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else tg.HapticFeedback.impactOccurred(type);
        } catch(e) {}
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [myStatus, setMyStatus] = useState('present');
      const [counts, setCounts] = useState({ present: 20, late: 2, excuse: 2, absent: 4 });
      const [isExportOpen, setIsExportOpen] = useState(false);
      const [isImportantOpen, setIsImportantOpen] = useState(false);

      const totalStudents = 28;
      const attended = counts.present + counts.late + counts.excuse;
      const percent = Math.round((attended / totalStudents) * 100);

      const handleStatusClick = (status) => {
        triggerHaptic('medium');
        if (myStatus === status) return;
        setCounts(prev => {
          const next = { ...prev };
          if (myStatus && next[myStatus] > 0) next[myStatus]--;
          next[status]++;
          return next;
        });
        setMyStatus(status);
      };

      const handleExport = () => {
        triggerHaptic('success');
        setIsExportOpen(true);
      };

      const downloadCsv = () => {
        const text = "\uFEFF№;ФИО;Статус\n1;Борисов Иван;На парах\n2;Алексеева Дарья;На парах\n3;Васильев Максим;На парах\n4;Дмитриев Артем;Опаздывает\n5;Жукова Полина;Уважительная\n6;Зайцев Роман;Отсутствует\n";
        const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Перекличка_ИВТ-21_17_октября.csv";
        a.click();

                    <div className="grid grid-cols-2 gap-2.5 mb-5">
                      <button onClick={() => handleStatusClick('present')} className={`flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#059669] active:scale-95 transition-all ${myStatus === 'present' ? 'ring-2 ring-white shadow-lg' : 'opacity-90'}`}>
                        <span>✓</span> <span>На парах</span>
                      </button>
                      <button onClick={() => handleStatusClick('late')} className={`flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#B45309] active:scale-95 transition-all ${myStatus === 'late' ? 'ring-2 ring-white shadow-lg' : 'opacity-90'}`}>
                        <span>🕒</span> <span>Опаздываю</span>
                      </button>
                      <button onClick={() => handleStatusClick('excuse')} className={`flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#4F46E5] active:scale-95 transition-all ${myStatus === 'excuse' ? 'ring-2 ring-white shadow-lg' : 'opacity-90'}`}>
                        <span>🛡</span> <span>Уважительная</span>
                      </button>
                      <button onClick={() => handleStatusClick('absent')} className={`flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl text-xs font-semibold text-white bg-[#991B1B] active:scale-95 transition-all ${myStatus === 'absent' ? 'ring-2 ring-white shadow-lg' : 'opacity-90'}`}>
                        <span>✕</span> <span>Отсутствую</span>
                      </button>
                    </div>

                    <div className="space-y-3">
                      <div className="flex items-center justify-between text-xs font-medium text-gray-200">
                        <div>
                          Явка: <b className="text-white">{attended} из {totalStudents}</b> <span className="text-gray-400">({percent}%)</span>
                        </div>
                        <button onClick={handleExport} className="px-3 py-1.5 rounded-full bg-[#1A1D27] hover:bg-[#252937] text-gray-300 border border-white/10 font-mono text-[11px] active:scale-95">
                          📥 /export → .xlsx
                        </button>
                      </div>
                      <div className="w-full h-1.5 bg-[#1F222E] rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-[#EF233C] to-[#FF2A4B] rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'schedule' && (
                <div className="space-y-4 pt-2">
                  <h2 className="text-lg font-bold font-unbounded text-white">Расписание недели</h2>
                  <div className="p-4 rounded-xl bg-[#14161D] border border-white/10 text-xs text-gray-300">
                    <p className="font-semibold text-white mb-2">Пятница, 17 октября (Сегодня)</p>
                    <ul className="space-y-2">
                      <li>• 08:30 Высшая математика — <span className="text-[#FB7185] font-bold">ОТМЕНА</span></li>
                      <li>• 10:15 Программирование (Ауд. 108) — <span className="text-[#34D399] font-bold">ПО ПЛАНУ</span></li>
                      <li>• 12:15 Базы данных (Ауд. 314) — <span className="text-[#FBBF24] font-bold">ДЕДЛАЙН</span></li>
                    </ul>
                  </div>
                </div>
              )}

              {activeTab === 'stats' && (
                <div className="space-y-4 pt-2">
                  <h2 className="text-lg font-bold font-unbounded text-white">Статистика группы</h2>
                  <div className="p-4 rounded-xl bg-[#14161D] border border-white/10">
                    <div className="text-xs text-gray-400">Общая явка группы</div>
                    <div className="text-3xl font-extrabold text-white mt-1 font-unbounded">89.4%</div>
                    <div className="w-full h-1.5 bg-[#1F222E] rounded-full mt-3 overflow-hidden">
                      <div className="h-full bg-emerald-500 rounded-full" style={{ width: '89.4%' }}></div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="space-y-4 pt-2">
                  <h2 className="text-lg font-bold font-unbounded text-white">Настройки</h2>
                  <div className="p-4 rounded-xl bg-[#14161D] border border-white/10 text-xs space-y-3">
                    <div className="text-gray-300"><b>Пользователь:</b> Иван Борисов (Староста)</div>
                    <div className="text-gray-300"><b>Группа:</b> ИВТ-21</div>
                    <div className="text-gray-400 text-[11px] pt-2 border-t border-white/5">
                      РИТМ Telegram Mini App v1.2.0. Все права защищены.
                    </div>
                  </div>
                </div>
              )}

              {/* Нижний таб-бар */}
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0B0C10]/95 backdrop-blur-md border-t border-white/[0.08] px-4 pt-2 pb-safe">
                <div className="max-w-md mx-auto flex items-center justify-around pb-2">
                  <button onClick={() => { triggerHaptic('selection'); setActiveTab('home'); }} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'home' ? 'text-[#EF233C]' : 'text-gray-400'}`}>
                    <span className="text-lg">🏠</span>
                    <span className="text-[10px] mt-0.5 font-medium">Главная</span>
                  </button>
                  <button onClick={() => { triggerHaptic('selection'); setActiveTab('schedule'); }} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'schedule' ? 'text-[#EF233C]' : 'text-gray-400'}`}>
                    <span className="text-lg">📅</span>
                    <span className="text-[10px] mt-0.5 font-medium">Расписание</span>
                  </button>
                  <button onClick={() => { triggerHaptic('selection'); setActiveTab('stats'); }} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'stats' ? 'text-[#EF233C]' : 'text-gray-400'}`}>
                    <span className="text-lg">📊</span>
                    <span className="text-[10px] mt-0.5 font-medium">Статистика</span>
                  </button>
                  <button onClick={() => { triggerHaptic('selection'); setActiveTab('settings'); }} className={`flex flex-col items-center py-1 px-3 ${activeTab === 'settings' ? 'text-[#EF233C]' : 'text-gray-400'}`}>
                    <span className="text-lg">⚙️</span>
                    <span className="text-[10px] mt-0.5 font-medium">Настройки</span>
                  </button>
                </div>
              </nav>
            </div>
          </div>

          {/* Модалка экспорта */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setIsExportOpen(false)}>
              <div className="w-full sm:max-w-md bg-[#161822] border border-white/15 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white">Выгрузка журнала явки</h3>
                  <button onClick={() => setIsExportOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-gray-300">
                  Сформирован файл посещаемости группы <b>ИВТ-21</b> за 17 октября (24 из 28 присутствуют).
                </p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => { navigator.clipboard.writeText("Отчет явки: 24 из 28 присутствуют."); alert('Скопировано в буфер!'); }} className="flex-1 py-2.5 rounded-xl bg-[#1A1D27] text-white text-xs font-semibold border border-white/10">
                    Копировать текст
                  </button>
                  <button onClick={downloadCsv} className="flex-1 py-2.5 rounded-xl bg-[#059669] hover:bg-[#10B981] text-white text-xs font-semibold">
                    Скачать .xlsx / .csv
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
